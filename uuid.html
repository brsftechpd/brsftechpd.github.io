<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID Tools</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Стили -->
    <link rel="stylesheet" href="tools/css/common.css">
    <link rel="stylesheet" href="tools/css/components/header.css">
    <link rel="stylesheet" href="tools/css/components/sidebar.css">
    <link rel="stylesheet" href="tools/css/components/footer.css">
    <link rel="stylesheet" href="tools/css/components/background-effects.css">
    <link rel="stylesheet" href="tools/css/uuid.css">
</head>

<body class="theme-dark">
    <!-- Background Effects -->
    <div id="background-effects"></div>
    
    <!-- Header -->
    <div id="header-container"></div>
    
    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Sidebar -->
        <div id="sidebar-container">
            <aside class="sidebar" id="sidebar" aria-label="Категории">
                <div class="sidebar-header">
                    <div class="sidebar-title">
                        <i class="fas fa-layer-group" aria-hidden="true"></i>
                        <span>Категории</span>
                    </div>
                </div>
                
                <div class="sidebar-nav-container">
                    <!-- Вкладки UUID Tools -->
                    <div class="uuid-tabs-navigation" id="tabsNavigation">
                        <button class="uuid-tab-btn active" data-tab="uuid">
                            <i class="fas fa-fingerprint"></i> Работа с UUID
                        </button>
                        <button class="uuid-tab-btn" data-tab="kig">
                            <i class="fas fa-id-card"></i> Поиск по КИГ
                        </button>
                        <button class="uuid-tab-btn" data-tab="passport">
                            <i class="fas fa-passport"></i> Проверка паспорта
                        </button>
                        <button class="uuid-tab-btn" data-tab="utc">
                            <i class="fas fa-clock"></i> UTC время
                        </button>
                    </div>

                    <!-- Улучшенная статистика в Sidebar - в виде списка -->
                    <div class="sidebar-stats-container" id="sidebarStatsContainer">
                        <div class="sidebar-stat-card">
                            <div class="sidebar-stats-header">
                                <div class="sidebar-stats-title">
                                    <i class="fas fa-chart-bar"></i>
                                    <span>Статистика</span>
                                </div>
                            </div>
                            <div class="sidebar-stats-description">
                                Статистика отформатированных UUID за сутки
                            </div>
                            <ul class="sidebar-stats-list">
                                <li class="sidebar-stat-item">
                                    <span class="sidebar-stat-label">Всего:</span>
                                    <span class="sidebar-stat-value" id="sidebarStatTotal">0</span>
                                </li>
                                <li class="sidebar-stat-item">
                                    <span class="sidebar-stat-label">Уникальных:</span>
                                    <span class="sidebar-stat-value" id="sidebarStatUnique">0</span>
                                </li>
                                <li class="sidebar-stat-item">
                                    <span class="sidebar-stat-label">Повторных:</span>
                                    <span class="sidebar-stat-value" id="sidebarStatRepeated">0</span>
                                </li>
                            </ul>
                            <button class="sidebar-clear-stats-btn" id="sidebarClearStatsBtn">
                                <i class="fas fa-trash"></i> Очистить статистику
                            </button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
        
        <!-- Main Content -->
        <main class="content" id="content"></main>
    </div>
    
    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Подключаем конфиг и компоненты -->
    <script src="index/js/config.js"></script>
    <script src="tools/js/components/header.js"></script>
    <script src="tools/js/components/footer.js"></script>
    <script src="tools/js/components/background-effects.js"></script>
    <script src="tools/js/config_uuid.js"></script>
    <script src="tools/js/uuid.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Загружаем конфиг для текущего инструмента
            const toolId = 'uuid';
            const toolConfig = toolsConfig.find(tool => tool.id === toolId);
            
            if (!toolConfig) {
                console.error('Конфиг для инструмента не найден');
                return;
            }

            // Инициализация компонентов
            // Фоновые эффекты
            const backgroundEffects = new BackgroundEffects();
            document.getElementById('background-effects').innerHTML = backgroundEffects.render();

            // Шапка
            const header = new Header(toolConfig);
            document.getElementById('header-container').innerHTML = header.render();
            header.initEventListeners();

            // Подвал
            const footer = new Footer();
            document.getElementById('footer-container').innerHTML = footer.render();

            // Инициализация приложения UUID Tools
            const uuidApp = new UUIDToolsApp();
            uuidApp.init();
        });
    </script>
</body>
</html>

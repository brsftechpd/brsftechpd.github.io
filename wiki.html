<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База знаний тех.поддержки</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f1629;
            --bg-secondary: #1a2238;
            --bg-tertiary: #242e48;
            --bg-accent: #4f46e5;
            --bg-accent-light: rgba(79, 70, 229, 0.1);
            --bg-success: #10b981;
            --bg-warning: #f59e0b;
            --bg-danger: #ef4444;
            --bg-partial: #f97316;
            --bg-info: #3b82f6;
            --text-primary: #f3f4f9;
            --text-secondary: #c7d2fe;
            --text-muted: #94a3b8;
            --border-color: #2a3655;
            --border-light: rgba(255, 255, 255, 0.05);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
            --radius: 8px;
            --radius-sm: 6px;
            --transition: all 0.2s ease;
            --glass-bg: rgba(26, 34, 56, 0.85);
            --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --gradient-secondary: linear-gradient(135deg, #1a2238 0%, #0f1629 100%);
            --sidebar-width: 280px;
            --sidebar-collapsed: 70px;
            --text-placeholder: #94a3b8;
            --scroll-thumb: #4f46e5;
            --logo-color: #4f46e5;
            --hover-ring: rgba(255, 255, 255, 0.05);
            --logo-text-bg: var(--gradient-primary);
        }

        .light-theme {
            --bg-primary: #f8fafc;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #ededed;
            --bg-accent: #4f46e5;
            --bg-accent-light: rgba(79, 70, 229, 0.08);
            --bg-success: #10b981;
            --bg-warning: #f59e0b;
            --bg-danger: #ef4444;
            --bg-partial: #f97316;
            --bg-info: #3b82f6;
            --text-primary: #1e293b;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --border-light: rgba(0, 0, 0, 0.08);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --gradient-secondary: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%);
            --text-placeholder: #94a3b8;
            --scroll-thumb: #94a3b8;
            --logo-color: #1e293b;
            --hover-ring: rgba(0, 0, 0, 0.05);
            --logo-text-bg: none;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: var(--gradient-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            transition: var(--transition);
        }

        .main-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .column {
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: var(--transition);
        }

        .left-column {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-light);
            position: relative;
            transition: width 0.3s ease;
        }

        .left-column.collapsed {
            width: var(--sidebar-collapsed);
        }

        .center-column {
            width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
        }

        .right-column {
            flex: 1;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }

        /* Логотип / кнопка домой */
        .sidebar-top {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-secondary);
            min-height: 56px;
            transition: justify-content 0.3s, padding 0.3s;
        }

        .left-column.collapsed .sidebar-top {
            justify-content: center;
            padding: 10.5px 8px;
        }

        .home-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            transition: padding 0.3s, gap 0.3s, width 0.3s, height 0.3s;
            white-space: nowrap;
            overflow: hidden;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;            /* усилено */
            letter-spacing: 0;           /* убран отрицательный */
        }

        .left-column.collapsed .home-logo {
            padding: 0;
            gap: 0;
            width: 40px;
            height: 40px;
            justify-content: center;
            border-radius: 50%;
        }

        .home-logo i {
            font-size: 20px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .home-logo-text {
            max-width: 200px;
            opacity: 1;
            transition: max-width 0.3s ease, opacity 0.3s ease;
            overflow: hidden;
            background: var(--text-secondary);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        .light-theme .home-logo-text {
            background: none;
            color: #1e293b;
        }

        .left-column.collapsed .home-logo-text {
            max-width: 0;
            opacity: 0;
            margin: 0;
        }

        .block-header {
            padding: 6px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            transition: padding 0.3s;
        }

        .left-column.collapsed .block-header {
            justify-content: center;
            padding: 6px 0;
        }

        .left-column.collapsed .block-header .collapse-btn {
            margin: 0 auto;
        }

        .categories-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            max-width: 250px;
            opacity: 1;
            transition: max-width 0.3s ease, opacity 0.3s ease, gap 0.3s ease;
        }

        .left-column.collapsed .categories-title {
            max-width: 0;
            opacity: 0;
            gap: 0;
        }

        .categories-title i {
            color: var(--bg-accent);
            font-size: 18px;
            flex-shrink: 0;
        }

        .collapse-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .collapse-btn:hover {
            background: var(--hover-ring);
        }

        .left-column.collapsed .collapse-btn i {
            transform: rotate(180deg);
        }

        /* Список категорий */
        .categories-list {
            flex: 1;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--scroll-thumb) transparent;
        }

        .categories-list::-webkit-scrollbar {
            width: 4px;
        }
        .categories-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .categories-list::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 2px;
        }

        .left-column.collapsed .categories-list {
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            scrollbar-width: none;
			gap: 15px;
        }

        .left-column.collapsed .categories-list::-webkit-scrollbar {
            display: none;
        }

        .category-item {
            padding: 10px 14px;
            margin-bottom: 6px;
            border-radius: var(--radius-sm);
            background: transparent;
            cursor: pointer;
            transition: background 0.2s ease, border-radius 0.3s, width 0.3s, height 0.3s, margin 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .category-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .light-theme .category-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .category-item.active {
            background: rgba(79, 70, 229, 0.15);
        }

        .light-theme .category-item.active {
            background: rgba(79, 70, 229, 0.08);
        }

        .category-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 16px;
            background: var(--bg-accent);
            border-radius: 0 2px 2px 0;
        }

        /* Свёрнутое состояние */
        .left-column.collapsed .category-item {
            padding: 0;
            justify-content: center;
            margin: 0 0 0 0;
            border-radius: 10px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .left-column.collapsed .category-item.active::before {
            content: '';
            position: absolute;
            left: -11px;
            top: 50%;
            transform: translateY(-50%);
            height: 24px;
            width: 3px;
            background: var(--bg-accent);
            border-radius: 0 3px 3px 0;
        }

        .left-column.collapsed .category-item:hover {
            background: transparent;
        }

        .category-icon-wrapper {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .left-column.collapsed .category-item .category-icon-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 10px;
        }

        .left-column.collapsed .category-item.active .category-icon-wrapper {
            border-radius: 50%;
            box-shadow: 0 0 0 5px var(--hover-ring);
        }

        .left-column.collapsed .category-item:hover .category-icon-wrapper {
            border-radius: 50%;
            box-shadow: 0 0 0 5px var(--hover-ring);
        }

        .category-icon {
            font-size: 16px;
            color: white;
        }

        .category-content {
            flex: 1;
            min-width: 0;
            transition: opacity 0.3s ease;
        }

        .left-column.collapsed .category-content {
            display: none;
        }

        .category-name {
            font-weight: 500;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-count {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 2px;
        }

        /* Разделители категорий */
        .category-divider {
            height: 1px;
            background: var(--border-light);
            margin: 12px 0;
            width: 100%;
            position: relative;
            transition: margin 0.3s, width 0.3s, opacity 0.3s;
            flex-shrink: 0;
        }

        .left-column.collapsed .category-divider {
            width: 36px;
            height: 2px;
            margin: 10px auto;
            background: var(--border-color);
            opacity: 0.9;
        }

        .main-divider .divider-text {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            padding: 0 10px;
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            z-index: 2;
            transition: opacity 0.3s;
        }

        .left-column.collapsed .main-divider .divider-text {
            display: none;
        }

        .light-theme .main-divider .divider-text {
            background: var(--bg-secondary);
        }

        .favorite-star {
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            padding: 4px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .favorite-star:hover {
            background: var(--hover-ring);
        }

        .favorite-star.active {
            color: #fbbf24;
        }

        .favorite-star.active i {
            font-weight: 900;
        }

        .left-column.collapsed .favorite-star {
            display: none;
        }

        .data-actions-panel {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-light);
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .left-column.collapsed .data-actions-panel {
            padding: 12px;
            align-items: center;
        }

        .data-actions-panel .btn {
            flex: 1;
            justify-content: center;
        }

        .left-column.collapsed .data-actions-panel .btn span {
            display: none;
        }

        .left-column.collapsed .data-actions-panel .btn {
            padding: 8px;
            width: 36px;
            height: 36px;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-light);
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .left-column.collapsed .sidebar-footer {
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .footer-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }

        .footer-btn.icon-only {
            flex: 0 0 auto;
            width: 37px;
            height: 37px;
            padding: 0;
            aspect-ratio: 1 / 1;
        }

        .footer-btn.icon-only span {
            display: none;
        }

        .footer-btn:hover {
            background: var(--hover-ring);
            border-color: var(--bg-accent);
        }

        .left-column.collapsed .footer-btn {
            width: 44px;
            height: 44px;
            padding: 0;
            justify-content: center;
            border-radius: var(--radius-sm);
            flex: 0 0 auto;
        }

        .left-column.collapsed .footer-btn span {
            display: none;
        }

        .theme-toggle-btn .sun-icon,
        .theme-toggle-btn .moon-icon {
            font-size: 16px;
            width: 16px;
        }

        .light-theme .theme-toggle-btn .sun-icon {
            display: inline-block;
            color: #f59e0b;
        }

        .light-theme .theme-toggle-btn .moon-icon {
            display: none;
        }

        .theme-toggle-btn .moon-icon {
            display: inline-block;
        }

        .theme-toggle-btn .sun-icon {
            display: none;
        }

        /* Центральная колонка */
        .search-container {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-secondary);
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--bg-accent);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .category-title-bar {
            padding: 12px 20px;
            font-weight: 600;
            font-size: 15px;
            background: linear-gradient(90deg, var(--bg-accent-light) 0%, transparent 70%);
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .category-title-bar i {
            font-size: 16px;
            color: var(--bg-accent);
        }

        .category-badge {
            background: var(--bg-accent);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .light-theme .category-badge {
            background: var(--bg-accent);
            color: white;
        }

        .templates-list-wrapper {
            flex: 1;
            position: relative;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .templates-list {
            height: 100%;
            overflow-y: auto;
            padding: 16px;
            background: var(--bg-secondary);
        }

        .functions-block {
            padding: 12px 20px;
            border-top: 1px solid var(--border-light);
            background: var(--bg-secondary);
        }

        .function-item {
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            padding: 5.5px 16px;
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .function-item:hover {
            background: var(--bg-accent-light);
        }

        .function-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            transition: .2s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background: var(--text-muted);
            transition: .2s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background: var(--bg-accent);
            border-color: var(--bg-accent);
        }

        input:checked+.slider:before {
            background: white;
            transform: translateX(20px);
        }

        .scroll-to-top-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-accent);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease, transform 0.25s ease;
            z-index: 10;
            font-size: 16px;
        }

        .scroll-to-top-btn.visible {
            opacity: 1;
            visibility: visible;
        }

        .scroll-to-top-btn:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }

        .template-item {
            padding: 14px;
            margin-bottom: 8px;
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .template-item:hover {
            border-color: var(--border-color);
        }

        .template-item.active {
            background: var(--bg-accent-light);
            border-color: var(--bg-accent);
        }

        .template-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }

        .template-header.no-margin {
            margin-bottom: 0;
        }

        .kb-match-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .kb-match-true {
            background-color: var(--bg-success);
            box-shadow: 0 0 6px var(--bg-success);
        }

        .kb-match-partial {
            background-color: var(--bg-partial);
            box-shadow: 0 0 6px var(--bg-partial);
        }

        .kb-match-false {
            background-color: var(--bg-danger);
            box-shadow: 0 0 6px var(--bg-danger);
        }

        .template-title {
            font-weight: 500;
            flex: 1;
            font-size: 14px;
            color: var(--text-primary);
            position: relative;
            z-index: 2;
        }

        .template-category-badge {
            font-size: 11px;
            color: var(--text-primary);
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(79, 70, 229, 0.15);
            font-weight: 500;
            position: relative;
            z-index: 2;
        }

        .light-theme .template-category-badge {
            color: var(--bg-accent);
            background: rgba(79, 70, 229, 0.1);
        }

        .template-type-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
            margin-left: 8px;
            position: relative;
            z-index: 2;
        }

        .type-other {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-muted);
        }

        .light-theme .type-other {
            background: rgba(148, 163, 184, 0.15);
        }

        .type-recommendation {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .light-theme .type-recommendation {
            background: rgba(16, 185, 129, 0.15);
        }

        .type-check {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .light-theme .type-check {
            background: rgba(59, 130, 246, 0.15);
        }

        .type-information {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }

        .light-theme .type-information {
            background: rgba(139, 92, 246, 0.15);
        }

        .template-detail-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .template-header-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-secondary);
            position: relative;
            overflow: hidden;
        }

        .template-header-copy-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 20px;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .template-header-copy-overlay.show {
            display: flex;
            opacity: 1;
            animation: fadeInOut 2s ease;
        }

        .template-header-copy-overlay i {
            font-size: 24px;
            margin-right: 12px;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .template-title-large {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .template-header-actions {
            display: flex;
            width: 100%;
            margin-top: 20px;
        }

        .template-header-actions .btn {
            width: 100%;
            justify-content: center;
        }

        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--gradient-primary);
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s;
        }

        .btn:hover::after {
            left: 100%;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        }

        .btn-copy {
            background: transparent;
            border: 1px solid #10b981;
            color: #10b981;
        }

        .light-theme .btn-copy {
            background: rgba(16, 185, 129, 0.1);
        }

        .btn-copy:hover {
            background: var(--hover-ring);
            border: 1px solid #10b981;
        }

        .template-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .tag {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-secondary);
        }

        .light-theme .tag {
            background: rgba(0, 0, 0, 0.07);
        }

        .template-content-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            overflow: hidden;
        }

        .template-content-view {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.6;
            font-size: 14px;
        }

        .template-content-view ul,
        .template-content-view ol {
            padding-left: 40px;
            margin: 8px 0;
        }

        .template-content-view li {
            margin-bottom: 4px;
        }

        .template-content-view hr {
            margin: 24px 0;
            border: none;
            height: 1px;
            background-color: rgb(255 255 255 / 27%);
        }

        .light-theme .template-content-view hr {
            background-color: rgba(0, 0, 0, 0.2);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 18px;
        }

        .empty-state p {
            max-width: 300px;
            line-height: 1.5;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 3px;
        }

        .template-group-header {
            padding: 8px 0;
            margin: 16px 0 8px 0;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }

        .template-group-header span:first-child {
            flex: 1;
        }

        .template-group-count {
            font-size: 11px;
            color: var(--text-muted);
        }

        .custom-tooltip {
            position: fixed;
            z-index: 9999;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            pointer-events: none;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            opacity: 0;
            transition: opacity 0.15s ease;
            white-space: nowrap;
            max-width: 325px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .custom-tooltip.show {
            opacity: 1;
        }

        .light-theme .custom-tooltip {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-container {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .modal-container p {
            margin-bottom: 20px;
            font-size: 16px;
            color: var(--text-primary);
        }
        .modal-container a {
            color: var(--bg-accent);
            text-decoration: none;
            font-weight: 600;
        }
        .modal-container button {
            background: var(--bg-accent);
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 1200px) {
            .center-column {
                width: 280px;
            }
        }
        @media (max-width: 992px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }
            .column {
                height: auto;
                width: 100% !important;
            }
            .left-column,
            .center-column {
                border-right: none;
                border-bottom: 1px solid var(--border-light);
                max-height: 40vh;
            }
            .left-column.collapsed {
                width: 100%;
            }
        }
        input[type="text"]::placeholder,
        textarea::placeholder {
            color: var(--text-placeholder);
        }
    </style>
</head>
<body>
    <div id="customTooltip" class="custom-tooltip"></div>
    <div class="main-container">
        <div class="column left-column" id="leftColumn">
            <div class="sidebar-top">
                <button class="home-logo" id="homeBtn" title="На главную">
                    <i class="fas fa-home"></i>
                    <span class="home-logo-text">База знаний</span>
                </button>
            </div>
            <div class="block-header">
                <div class="categories-title">
                    <i class="fas fa-folder"></i> Категории
                </div>
                <button class="collapse-btn" id="collapseBtn">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <div class="categories-list" id="categoriesList"></div>
            <div class="data-actions-panel" id="dataActionsPanel">
                <button class="btn btn-success btn-sm" id="refreshDataBtn">
                    <i class="fas fa-sync-alt"></i>
                    <span>Обновить данные</span>
                </button>
            </div>
            <div class="sidebar-footer">
                <button class="footer-btn theme-toggle-btn" id="themeToggleBtn" title="Сменить тему">
                    <i class="fas fa-moon moon-icon"></i>
                    <i class="fas fa-sun sun-icon"></i>
                    <span class="theme-label">Темная тема</span>
                </button>
                <button class="footer-btn icon-only" id="contactBtn" title="Связаться">
                    <i class="fas fa-headset"></i>
                    <span>Связаться</span>
                </button>
            </div>
        </div>
        <div class="column center-column">
            <div class="search-container"><input type="text" class="search-input" id="searchInput" placeholder="Поиск"></div>
            <div class="category-title-bar" id="categoryTitleBar"></div>
            <div class="templates-list-wrapper" id="templatesListWrapper">
                <div class="templates-list" id="templatesList"></div>
                <button class="scroll-to-top-btn" id="scrollToTopBtn" title="Прокрутить вверх"><i class="fas fa-arrow-up"></i></button>
            </div>
            <div class="functions-block">
                <div class="function-item" data-tooltip="Автоматически копировать шаблон при клике">
                    <div class="function-label">Копировать при клике</div>
                    <label class="switch"><input type="checkbox" id="copyOnClickToggle"><span class="slider"></span></label>
                </div>
            </div>
        </div>
        <div class="column right-column">
            <div id="templateDetailView" class="template-detail-view">
                <div class="template-header-section"><div class="template-header-copy-overlay" id="templateHeaderCopyOverlay"><i class="fas fa-check-circle"></i><span>Скопировано в буфер обмена для ответа</span></div>
                <div class="template-title-large" id="templateTitleLarge">Шаблон не выбран</div>
                <div id="templateMetaGrid" class="template-meta-grid"></div>
                <div id="tagsContainer" class="tags-container"></div>
                <div class="template-header-actions" id="templateHeaderActions"><button class="btn btn-copy" id="copyAnswerBtn"><i class="fas fa-copy"></i> Скопировать для ответа</button></div>
                </div>
                <div class="template-content-container"><div class="template-content-view" id="templateContentView"></div></div>
            </div>
            <div id="emptyStateView" class="empty-state" style="display: none;"><i class="fas fa-file-alt"></i><h3>Шаблон не выбран</h3><p>Выберите шаблон из списка</p></div>
        </div>
    </div>
    <div id="modalOverlay" class="modal-overlay"><div class="modal-container"><p>Есть вопрос или предложение? Пиши в телегу <a href="https://t.me/shilov_dv" target="_blank">@shilov_dv</a></p><button id="closeModalBtn">Закрыть</button></div></div>

    <script>
        let categories = [], templates = [], currentCategoryId = 'all', currentTemplateId = null, isSidebarCollapsed = false, updateCheckInterval = null, isLightTheme = false;
        const tooltipEl = document.getElementById('customTooltip');

        document.addEventListener('DOMContentLoaded', function() {
            loadThemePreference(); loadInitialData(); setupEventListeners(); updateThemeToggleLabel();
            updateCheckInterval = setInterval(checkForUpdates, 600000);
            setupTooltipListeners();
            setupScrollToTopButton();
        });

        function loadThemePreference() { const savedTheme = localStorage.getItem('support-kb-theme'); isLightTheme = savedTheme === 'light'; if (isLightTheme) document.body.classList.add('light-theme'); }
        function toggleTheme() { isLightTheme = !isLightTheme; document.body.classList.toggle('light-theme', isLightTheme); localStorage.setItem('support-kb-theme', isLightTheme ? 'light' : 'dark'); updateThemeToggleLabel(); }
        function updateThemeToggleLabel() { const label = document.querySelector('.theme-label'); if(label) label.textContent = isLightTheme ? 'Светлая тема' : 'Темная тема'; }

        function loadInitialData() {
            const savedCategories = localStorage.getItem('support-kb-categories'), savedTemplates = localStorage.getItem('support-kb-templates');
            if(savedCategories && savedTemplates) { try { categories = JSON.parse(savedCategories); templates = JSON.parse(savedTemplates); } catch(e) { loadDataFromServer(); return; } updateLocalDataFromServer(); }
            else { loadDataFromServer(); return; }
            const savedSidebarState = localStorage.getItem('support-kb-sidebar-collapsed');
            isSidebarCollapsed = savedSidebarState === 'true';
            if(isSidebarCollapsed) document.getElementById('leftColumn').classList.add('collapsed');
            initApp();
        }

        function loadDataFromServer() {
            fetch('wiki/data.js?' + new Date().getTime()).then(res => res.text()).then(jsCode => {
                try { const fn = new Function(`${jsCode}; return initAppData();`); const data = fn(); if(data && data.categories && data.templates) { categories = data.categories.map(c => ({ ...c, isFavorite: c.isFavorite || false, favoritedAt: c.favoritedAt || null })); templates = data.templates; saveDataToLocalStorage(); const saved = localStorage.getItem('support-kb-sidebar-collapsed'); isSidebarCollapsed = saved === 'true'; if(isSidebarCollapsed) document.getElementById('leftColumn').classList.add('collapsed'); initApp(); } } catch(e) { console.error(e); } }).catch(e => console.error(e));
        }

        function checkForUpdates() { fetch('wiki/data.js?' + new Date().getTime()).then(res => res.text()).then(jsCode => { try { const fn = new Function(`${jsCode}; return initAppData();`); const data = fn(); if(data && data.categories && data.templates) checkForDataUpdates({ categories: data.categories, templates: data.templates }); } catch(e) {} }).catch(e => {}); }

        function checkForDataUpdates(serverData) { if(!serverData) return;
            const localCats = categories.map(({ isFavorite, favoritedAt, ...rest }) => rest).sort((a,b)=>a.id.localeCompare(b.id));
            const serverCats = serverData.categories.map(({ isFavorite, favoritedAt, ...rest }) => rest).sort((a,b)=>a.id.localeCompare(b.id));
            const localTemps = [...templates].sort((a,b)=>a.id.localeCompare(b.id)); const serverTemps = [...serverData.templates].sort((a,b)=>a.id.localeCompare(b.id));
            if(JSON.stringify(localCats)!==JSON.stringify(serverCats) || JSON.stringify(localTemps)!==JSON.stringify(serverTemps)) document.getElementById('dataActionsPanel').style.display = 'flex'; else document.getElementById('dataActionsPanel').style.display = 'none';
        }

        function saveDataToLocalStorage() { localStorage.setItem('support-kb-categories', JSON.stringify(categories)); localStorage.setItem('support-kb-templates', JSON.stringify(templates)); }
        function initApp() { renderCategories(); renderTemplates(); showEmptyStateView(); }

        function setupEventListeners() {
            document.getElementById('collapseBtn').addEventListener('click', toggleSidebar);
            document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
            document.getElementById('homeBtn').addEventListener('click', () => { window.location.href = '/'; });
            document.getElementById('copyAnswerBtn').addEventListener('click', copyAnswerToClipboard);
            document.getElementById('refreshDataBtn').addEventListener('click', updateLocalDataFromServer);
            document.getElementById('searchInput').addEventListener('input', filterTemplates);
            document.getElementById('copyOnClickToggle').addEventListener('change', function(){});
            document.getElementById('contactBtn').addEventListener('click', () => { document.getElementById('modalOverlay').classList.add('active'); });
            document.getElementById('closeModalBtn').addEventListener('click', () => { document.getElementById('modalOverlay').classList.remove('active'); });
            document.getElementById('modalOverlay').addEventListener('click', (e) => { if(e.target === document.getElementById('modalOverlay')) document.getElementById('modalOverlay').classList.remove('active'); });
        }

        function setupScrollToTopButton() {
            const list = document.getElementById('templatesList');
            const btn = document.getElementById('scrollToTopBtn');
            if (!list || !btn) return;

            function toggleVisibility() {
                if (list.scrollTop > 200) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            }

            list.addEventListener('scroll', toggleVisibility);
            btn.addEventListener('click', () => {
                list.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Вызываем один раз для начального состояния (после рендера)
            toggleVisibility();
        }

        function setupTooltipListeners() {
            const list = document.getElementById('categoriesList');
            list.addEventListener('mouseover', function(e) {
                const item = e.target.closest('.category-item');
                if (!item || !isSidebarCollapsed) { hideTooltip(); return; }
                const nameEl = item.querySelector('.category-name');
                if (!nameEl || !nameEl.textContent.trim()) { hideTooltip(); return; }
                tooltipEl.textContent = nameEl.textContent.trim();
                tooltipEl.classList.add('show');
                const rect = item.getBoundingClientRect();
                tooltipEl.style.left = rect.right + 10 + 'px';
                tooltipEl.style.top = rect.top + rect.height/2 + 'px';
                tooltipEl.style.transform = 'translateY(-50%)';
            });
            list.addEventListener('mouseout', function(e) {
                if (!e.target.closest('.category-item')) hideTooltip();
            });
            list.addEventListener('scroll', hideTooltip);

            // Тултип для function-item
            const funcItem = document.querySelector('.function-item');
            if (funcItem) {
                const tooltipText = funcItem.getAttribute('data-tooltip') || 'Автоматически копировать шаблон при клике';
                funcItem.addEventListener('mouseenter', function(e) {
                    tooltipEl.textContent = tooltipText;
                    tooltipEl.classList.add('show');
                    const rect = funcItem.getBoundingClientRect();
                    tooltipEl.style.left = rect.left + rect.width / 2 + 'px';
                    tooltipEl.style.top = rect.top - 10 + 'px';
                    tooltipEl.style.transform = 'translate(-50%, -100%)';
                });
                funcItem.addEventListener('mouseleave', function(e) {
                    hideTooltip();
                });
                // Скрываем тултип при скролле страницы или окна
                window.addEventListener('scroll', hideTooltip);
            }

            // Дополнительно: скрываем тултип при скролле в списке шаблонов
            const templatesListEl = document.getElementById('templatesList');
            if (templatesListEl) {
                templatesListEl.addEventListener('scroll', hideTooltip);
            }
            window.addEventListener('resize', hideTooltip);
        }

        function hideTooltip() {
            tooltipEl.classList.remove('show');
        }

        function updateLocalDataFromServer() {
            fetch('wiki/data.js?' + new Date().getTime()).then(res => res.text()).then(jsCode => {
                try { const fn = new Function(`${jsCode}; return initAppData();`); const data = fn(); if(data && data.categories && data.templates) {
                    const serverData = { categories: data.categories, templates: data.templates };
                    categories = serverData.categories.map(sc => { const local = categories.find(c => c.id === sc.id); return { ...sc, isFavorite: local ? local.isFavorite : false, favoritedAt: local ? local.favoritedAt : null }; });
                    templates = serverData.templates; saveDataToLocalStorage(); document.getElementById('dataActionsPanel').style.display = 'none'; renderCategories(); renderTemplates();
                    if(currentTemplateId && !templates.find(t=>t.id===currentTemplateId)) { currentTemplateId = null; showEmptyStateView(); }
                } } catch(e) { console.error(e); }
            }).catch(e => console.error(e));
        }

        function renderCategories() {
            const list = document.getElementById('categoriesList');
            list.innerHTML = '';

            const allItem = document.createElement('div');
            allItem.className = `category-item ${currentCategoryId === 'all' ? 'active' : ''}`;
            allItem.innerHTML = `<div class="category-icon-wrapper" style="background: linear-gradient(135deg, #64748b, #475569);"><i class="category-icon fas fa-th-list"></i></div><div class="category-content"><div class="category-name">Все шаблоны</div><div class="category-count">${templates.length} ${pluralize(templates.length)}</div></div>`;
            allItem.addEventListener('click', () => { currentCategoryId = 'all'; renderCategories(); renderTemplates(); });
            list.appendChild(allItem);

            const mainDivider = document.createElement('div');
            mainDivider.className = 'category-divider main-divider';
            const favCats = categories.filter(c=>c.isFavorite).sort((a,b)=>new Date(a.favoritedAt)-new Date(b.favoritedAt));
            if (favCats.length > 0) {
                const span = document.createElement('span');
                span.className = 'divider-text';
                span.innerHTML = '<i class="fas fa-star" style="color: #fbbf24; margin-right: 4px;"></i>Избранное';
                mainDivider.appendChild(span);
            }
            list.appendChild(mainDivider);

            if (favCats.length > 0) {
                favCats.forEach(c => renderCategoryItem(c, list));
                const afterFavDivider = document.createElement('div');
                afterFavDivider.className = 'category-divider';
                list.appendChild(afterFavDivider);
            }

            categories.filter(c=>!c.isFavorite).forEach(c=>renderCategoryItem(c,list));

            if(isSidebarCollapsed) addTooltipsToCategories();
        }

        function renderCategoryItem(category, container) {
            const item = document.createElement('div');
            item.className = `category-item ${currentCategoryId === category.id ? 'active' : ''}`;
            const count = templates.filter(t => t.categoryId === category.id).length;
            const starClass = category.isFavorite ? 'fas fa-star' : 'far fa-star';
            item.innerHTML = `<div class="category-icon-wrapper" style="background: ${category.color};"><i class="category-icon ${category.icon || 'fas fa-folder'}"></i></div><div class="category-content"><div class="category-name">${category.name}</div><div class="category-count">${count} ${pluralize(count)}</div></div><div class="favorite-star ${category.isFavorite ? 'active' : ''}" data-action="toggleFavorite"><i class="${starClass}"></i></div>`;
            item.addEventListener('click', function(e) { if(e.target.closest('.favorite-star')) { toggleCategoryFavorite(category.id); return; } currentCategoryId = category.id; renderCategories(); renderTemplates(); });
            container.appendChild(item);
        }

        function addTooltipsToCategories() {
            document.querySelectorAll('.category-item').forEach(item => {
                const nameDiv = item.querySelector('.category-name');
                if(nameDiv && nameDiv.textContent) item.setAttribute('data-cat-name', nameDiv.textContent);
                else item.removeAttribute('data-cat-name');
            });
        }

        function toggleCategoryFavorite(categoryId) { const idx = categories.findIndex(c=>c.id===categoryId); if(idx===-1) return; categories[idx].isFavorite = !categories[idx].isFavorite; categories[idx].favoritedAt = categories[idx].isFavorite ? new Date().toISOString() : null; saveDataToLocalStorage(); renderCategories(); }
        function stripHtml(html) { const tmp = document.createElement('div'); tmp.innerHTML = html; return tmp.textContent || tmp.innerText || ''; }

        function renderTemplates() {
            const list = document.getElementById('templatesList'); const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = templates; if(currentCategoryId !== 'all') filtered = filtered.filter(t=>t.categoryId===currentCategoryId);
            if(query) filtered = filtered.filter(t=> t.title.toLowerCase().includes(query) || t.description.toLowerCase().includes(query) || (t.tags && t.tags.some(tag=>tag.toLowerCase().includes(query))) || stripHtml(t.content).toLowerCase().includes(query));
            const titleBar = document.getElementById('categoryTitleBar');
            let titleHtml = ''; let countVal = filtered.length;
            if(query) titleHtml = `<span>Результаты поиска: "${query}"</span><span class="category-badge">${countVal}</span>`;
            else if(currentCategoryId === 'all') titleHtml = `<span>Все шаблоны</span><span class="category-badge">${countVal}</span>`;
            else { const cat = categories.find(c=>c.id===currentCategoryId); titleHtml = cat ? `<span>${cat.name}</span><span class="category-badge">${countVal}</span>` : `<span><i class="fas fa-folder"></i> Категория</span><span class="category-badge">${countVal}</span>`; }
            titleBar.innerHTML = titleHtml; titleBar.style.display = 'flex';
            list.innerHTML = '';
            if(filtered.length===0) { list.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><h3>Шаблоны не найдены</h3><p>Попробуйте изменить критерии поиска</p></div>`; return; }
            const typeOrder = { recommendation:1, information:2, check:3, other:4 }; filtered.sort((a,b)=>typeOrder[a.type]-typeOrder[b.type]);
            const grouped = {}; filtered.forEach(t=>{ if(!grouped[t.type]) grouped[t.type]=[]; grouped[t.type].push(t); });
            const groupNames = { recommendation:'Рекомендации', information:'Информация', check:'Проверки', other:'Остальное' };
            ['recommendation','information','check','other'].forEach(type=>{ if(grouped[type] && grouped[type].length){
                const gh = document.createElement('div'); gh.className='template-group-header'; gh.innerHTML=`<span>${groupNames[type]}</span><span class="template-group-count">${grouped[type].length}</span>`; list.appendChild(gh);
                grouped[type].forEach(template=>{ const category=categories.find(c=>c.id===template.categoryId); const item=document.createElement('div'); item.className=`template-item ${currentTemplateId===template.id?'active':''}`; const showCat=currentCategoryId==='all' && category; const typeClass={recommendation:'type-recommendation',information:'type-information',check:'type-check',other:'type-other'}[template.type]; const typeText={recommendation:'Рекомендация',information:'Информация',check:'Проверка',other:'Остальное'}[template.type];
                    item.innerHTML=`<div class="template-header ${showCat?'':'no-margin'}"><div class="kb-match-indicator kb-match-${template.kbMatch}"></div><div class="template-title">${template.title}</div><span class="template-type-badge ${typeClass}">${typeText}</span></div>${showCat?`<div class="template-category-badge">${category.name}</div>`:''}`;
                    item.addEventListener('click',()=>{ selectTemplate(template.id); if(document.getElementById('copyOnClickToggle').checked) copyOnClickWithEffect(template.id); });
                    list.appendChild(item);
                });
            }});

            // После рендера шаблонов проверяем видимость кнопки прокрутки вверх
            const btn = document.getElementById('scrollToTopBtn');
            const templatesList = document.getElementById('templatesList');
            if (btn && templatesList) {
                if (templatesList.scrollTop > 200) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            }
        }

        function showTemplateDetail(templateId){ const template=templates.find(t=>t.id===templateId); if(!template) return; const category=categories.find(c=>c.id===template.categoryId);
            document.getElementById('templateDetailView').style.display='flex'; document.getElementById('emptyStateView').style.display='none'; document.getElementById('templateTitleLarge').textContent=template.title;
            const typeMap={recommendation:'Рекомендация',information:'Информация',check:'Проверка',other:'Остальное'}; const kbMap={true:'Соответствует',partial:'Частично',false:'Не соответствует'};
            document.getElementById('templateMetaGrid').innerHTML=`<div class="meta-item"><div class="meta-label">Категория</div><div class="meta-value"><i class="fas fa-folder" style="color:${category?.color||'#64748b'}"></i> ${category?.name||'—'}</div></div><div class="meta-item"><div class="meta-label">Тип шаблона</div><div class="meta-value"><i class="fas fa-tag"></i> ${typeMap[template.type]}</div></div><div class="meta-item"><div class="meta-label">Соответствие БЗ</div><div class="meta-value"><div class="kb-match-indicator kb-match-${template.kbMatch}"></div> ${kbMap[template.kbMatch]}</div></div><div class="meta-item"><div class="meta-label">Дата создания</div><div class="meta-value"><i class="far fa-calendar"></i> ${formatDate(template.createdAt)}</div></div><div class="meta-item"><div class="meta-label">Дата обновления</div><div class="meta-value"><i class="fas fa-history"></i> ${formatDate(template.updatedAt)}</div></div><div class="meta-item" style="grid-column:1/-1;"><div class="meta-label">Описание</div><div class="meta-value">${template.description||'Описание отсутствует'}</div></div>`;
            document.getElementById('tagsContainer').innerHTML=template.tags&&template.tags.length?template.tags.map(t=>`<span class="tag">${t}</span>`).join(''):'<span class="tag" style="opacity:0.5;">Теги не указаны</span>';
            const tempDiv=document.createElement('div'); tempDiv.innerHTML=template.content; tempDiv.querySelectorAll('hr').forEach(hr=>{ const newHr=document.createElement('hr'); hr.parentNode.replaceChild(newHr,hr); });
            document.getElementById('templateContentView').innerHTML=tempDiv.innerHTML;
        }

        function showEmptyStateView(){ document.getElementById('templateDetailView').style.display='none'; document.getElementById('emptyStateView').style.display='flex'; }
        function selectTemplate(id){ currentTemplateId=id; renderTemplates(); showTemplateDetail(id); }
        function toggleSidebar(){ const col=document.getElementById('leftColumn'); isSidebarCollapsed=!isSidebarCollapsed; col.classList.toggle('collapsed',isSidebarCollapsed); localStorage.setItem('support-kb-sidebar-collapsed',isSidebarCollapsed); hideTooltip(); renderCategories(); }
        function showCopyOverlay(){ const overlay=document.getElementById('templateHeaderCopyOverlay'); overlay.classList.remove('show'); void overlay.offsetWidth; overlay.classList.add('show'); setTimeout(()=>overlay.classList.remove('show'),2000); }
        function copyOnClickWithEffect(id){ const template=templates.find(t=>t.id===id); if(template) copyTemplateContentToClipboard(template); showCopyOverlay(); }
        function copyAnswerToClipboard(){ if(!currentTemplateId) return; const template=templates.find(t=>t.id===currentTemplateId); if(template) copyTemplateContentToClipboard(template); showCopyOverlay(); }
        function copyTemplateContentToClipboard(template){ const div=document.createElement('div'); div.innerHTML=template.content; const textarea=document.createElement('textarea'); textarea.value=div.textContent||div.innerText||''; document.body.appendChild(textarea); textarea.select(); try{ const htmlBlob=new Blob([template.content],{type:'text/html'}); const textBlob=new Blob([textarea.value],{type:'text/plain'}); const item=new ClipboardItem({'text/html':htmlBlob,'text/plain':textBlob}); navigator.clipboard.write([item]).catch(()=>navigator.clipboard.writeText(textarea.value)); }catch(e){ document.execCommand('copy'); }finally{ document.body.removeChild(textarea); } }
        function filterTemplates(){ renderTemplates(); }
        function formatDate(dateString){ const date=new Date(dateString); return date.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}); }
        function pluralize(n){ const mod10=n%10, mod100=n%100; if(mod10===1&&mod100!==11) return 'шаблон'; if([2,3,4].includes(mod10)&&![12,13,14].includes(mod100)) return 'шаблона'; return 'шаблонов'; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База знаний тех.поддержки</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Темная тема (по умолчанию) */
            --bg-primary: #0f1629;
            --bg-secondary: #1a2238;
            --bg-tertiary: #242e48;
            --bg-accent: #4f46e5;
            --bg-accent-light: rgba(79, 70, 229, 0.1);
            --bg-success: #10b981;
            --bg-warning: #f59e0b;
            --bg-danger: #ef4444;
            --bg-partial: #f97316;
            --bg-info: #3b82f6;
            --text-primary: #f3f4f9;
            --text-secondary: #c7d2fe;
            --text-muted: #94a3b8;
            --border-color: #2a3655;
            --border-light: rgba(255, 255, 255, 0.05);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
            --radius: 8px;
            --radius-sm: 6px;
            --transition: all 0.2s ease;
            --glass-bg: rgba(26, 34, 56, 0.95);
            --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --gradient-secondary: linear-gradient(135deg, #1a2238 0%, #0f1629 100%);
            --sidebar-width: 280px;
            --sidebar-collapsed: 70px;
            --text-placeholder: #94a3b8;
            --header-height: 60px;
        }

        /* Светлая тема */
        .light-theme {
            --bg-primary: #f8fafc;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #ededed;
            --bg-accent: #4f46e5;
            --bg-accent-light: rgba(79, 70, 229, 0.08);
            --bg-success: #10b981;
            --bg-warning: #f59e0b;
            --bg-danger: #ef4444;
            --bg-partial: #f97316;
            --bg-info: #3b82f6;
            --text-primary: #1e293b;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --border-light: rgba(0, 0, 0, 0.08);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --gradient-secondary: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%);
            --text-placeholder: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: var(--gradient-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            transition: var(--transition);
        }

        /* Шапка */
        .main-header {
            height: var(--header-height);
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-center {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Кнопка домой */
        .home-btn {
            background: var(--bg-accent);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .home-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        .home-btn:active {
            transform: translateY(0);
        }

        /* Название приложения */
        .app-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-title i {
            color: var(--bg-accent);
            font-size: 20px;
        }

        /* Кнопка переключения темы в шапке */
        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--bg-accent);
        }

        .light-theme .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .theme-toggle .theme-icon {
            font-size: 16px;
        }

        .theme-toggle .sun-icon {
            display: none;
        }

        .theme-toggle .moon-icon {
            display: block;
        }

        .light-theme .theme-toggle .sun-icon {
            display: block;
            color: #f59e0b;
        }

        .light-theme .theme-toggle .moon-icon {
            display: none;
        }

        /* Основной контейнер */
        .main-container {
            display: flex;
            height: calc(100vh - var(--header-height));
            overflow: hidden;
        }

        /* Основные колонки */
        .column {
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: var(--transition);
        }

        .left-column {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-light);
            position: relative;
        }

        .left-column.collapsed {
            width: var(--sidebar-collapsed);
        }

        .center-column {
            width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
        }

        .right-column {
            flex: 1;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }

        /* Заголовки блоков */
        .block-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 22, 41, 0.8);
        }

        .light-theme .block-header {
            background: rgba(248, 250, 252, 0.8);
        }

        .block-header span {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .left-column.collapsed .block-header span {
            display: none;
        }

        /* Кнопки */
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--gradient-primary);
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s;
        }

        .btn:hover::after {
            left: 100%;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        }

        .btn-copy {
            background: transparent;
            border: 1px solid #10b981;
            color: #10b981;
        }

        .light-theme .btn-copy {
            background: rgba(16, 185, 129, 0.1);
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #10b981;
        }

        .light-theme .btn-copy:hover {
            background: rgba(16, 185, 129, 0.15);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-color);
        }

        .light-theme .btn-outline:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-icon {
            padding: 8px;
            width: 36px;
            height: 36px;
            justify-content: center;
            border-radius: var(--radius-sm);
        }

        .btn-tiny {
            padding: 4px 8px;
            font-size: 12px;
            min-width: auto;
        }

        /* Кнопка сворачивания */
        .collapse-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .collapse-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .light-theme .collapse-btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .left-column.collapsed .collapse-btn i {
            transform: rotate(180deg);
        }

        /* Левый блок - Категории */
        .categories-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-accent) transparent;
        }

        .categories-list::-webkit-scrollbar {
            width: 4px;
        }

        .categories-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .categories-list::-webkit-scrollbar-thumb {
            background: var(--bg-accent);
            border-radius: 2px;
        }

        .category-item {
            padding: 10px 14px;
            margin-bottom: 6px;
            border-radius: var(--radius-sm);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .category-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .light-theme .category-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .category-item.active {
            background: rgba(79, 70, 229, 0.15);
        }

        .light-theme .category-item.active {
            background: rgba(79, 70, 229, 0.08);
        }

        .category-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 16px;
            background: var(--bg-accent);
            border-radius: 0 2px 2px 0;
        }

        /* Discord-стиль для свернутой панели */
        .left-column.collapsed .categories-list {
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .left-column.collapsed .category-item.active {
            position: relative;
            background: transparent !important;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 0 8px 0;
        }

        .left-column.collapsed .category-item.active::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            height: 24px;
            width: 3px;
            background: var(--bg-accent);
            border-radius: 0 3px 3px 0;
        }

        .left-column.collapsed .category-item.active .category-icon-wrapper {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(79, 70, 229, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .light-theme .left-column.collapsed .category-item.active .category-icon-wrapper {
            background: rgba(79, 70, 229, 0.1);
        }

        .left-column.collapsed .category-item {
            padding: 0;
            justify-content: center;
            margin: 0 0 8px 0;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .category-icon-wrapper {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .left-column.collapsed .category-item .category-icon-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .left-column.collapsed .category-item:hover .category-icon-wrapper {
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .light-theme .left-column.collapsed .category-item:hover .category-icon-wrapper {
            background: rgba(0, 0, 0, 0.1);
        }

        .category-icon {
            font-size: 16px;
            color: white;
        }

        .category-content {
            flex: 1;
            min-width: 0;
        }

        .left-column.collapsed .category-content {
            display: none;
        }

        .category-name {
            font-weight: 500;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-count {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 2px;
        }

        .category-divider {
            height: 1px;
            background: var(--border-light);
            margin: 12px 0;
            width: 100%;
        }

        .left-column.collapsed .category-divider {
            width: 36px;
            margin: 12px auto;
        }

        .left-column.collapsed .category-divider[style*="position: relative"] {
            display: none !important;
        }

        /* Иконка избранного для категорий */
        .favorite-star {
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            padding: 4px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .favorite-star:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .light-theme .favorite-star:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .favorite-star.active {
            color: #fbbf24;
        }

        .favorite-star.active i {
            font-weight: 900;
        }

        .left-column.collapsed .favorite-star {
            display: none;
        }

        /* Импорт/Экспорт панель */
        .data-actions-panel {
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-light);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            display: none; /* По умолчанию скрыта */
        }

        .left-column.collapsed .data-actions-panel {
            padding: 12px;
            align-items: center;
        }

        .data-actions-panel .btn {
            flex: 1;
            justify-content: center;
        }

        .left-column.collapsed .data-actions-panel .btn span {
            display: none;
        }

        .left-column.collapsed .data-actions-panel .btn {
            padding: 8px;
            width: 36px;
            height: 36px;
        }

        /* Центральный блок - Функции и Шаблоны */
        .functions-block {
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-secondary);
        }

        .function-item {
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 0;
            border: 1px solid var(--border-light);
        }

        .function-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .function-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .function-description {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            transition: .2s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background: var(--text-muted);
            transition: .2s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background: var(--bg-accent);
            border-color: var(--bg-accent);
        }

        input:checked+.slider:before {
            background: white;
            transform: translateX(20px);
        }

        .search-container {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-secondary);
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--bg-accent);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .templates-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--bg-secondary);
        }

        .template-item {
            padding: 14px;
            margin-bottom: 8px;
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .template-item:hover {
            border-color: var(--border-color);
        }

        .template-item.active {
            background: var(--bg-accent-light);
            border-color: var(--bg-accent);
        }

        .template-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }

        .template-header.no-margin {
            margin-bottom: 0;
        }

        .kb-match-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .kb-match-true {
            background-color: var(--bg-success);
            box-shadow: 0 0 6px var(--bg-success);
        }

        .kb-match-partial {
            background-color: var(--bg-partial);
            box-shadow: 0 0 6px var(--bg-partial);
        }

        .kb-match-false {
            background-color: var(--bg-danger);
            box-shadow: 0 0 6px var(--bg-danger);
        }

        .template-title {
            font-weight: 500;
            flex: 1;
            font-size: 14px;
            color: var(--text-primary);
            position: relative;
            z-index: 2;
        }

        .template-category-badge {
            font-size: 11px;
            color: var(--text-primary);
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(79, 70, 229, 0.15);
            font-weight: 500;
            position: relative;
            z-index: 2;
        }

        .light-theme .template-category-badge {
            color: var(--bg-accent);
            background: rgba(79, 70, 229, 0.1);
        }

        /* Бейдж типа шаблона */
        .template-type-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
            margin-left: 8px;
            position: relative;
            z-index: 2;
        }

        .type-other {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-muted);
        }

        .light-theme .type-other {
            background: rgba(148, 163, 184, 0.15);
        }

        .type-recommendation {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .light-theme .type-recommendation {
            background: rgba(16, 185, 129, 0.15);
        }

        .type-check {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .light-theme .type-check {
            background: rgba(59, 130, 246, 0.15);
        }

        .type-information {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }

        .light-theme .type-information {
            background: rgba(139, 92, 246, 0.15);
        }

        /* Правый блок - Переработанный дизайн без вкладок */
        .template-detail-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .template-header-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-secondary);
            position: relative;
            overflow: hidden;
        }

        /* Оверлей для копирования */
        .template-header-copy-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 20px;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .template-header-copy-overlay.show {
            display: flex;
            opacity: 1;
            animation: fadeInOut 2s ease;
        }

        .template-header-copy-overlay i {
            font-size: 24px;
            margin-right: 12px;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .template-title-large {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-right: 0;
        }

        /* Измененный стиль для кнопки копирования в нижней части шапки */
        .template-header-actions {
            display: flex;
            width: 100%;
            margin-top: 20px;
        }

        .template-header-actions .btn {
            width: 100%;
            justify-content: center;
        }

        .template-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .tag {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-secondary);
        }

        .light-theme .tag {
            background: rgba(0, 0, 0, 0.07);
        }

        /* Контейнер для отображения содержимого шаблона */
        .template-content-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            overflow: hidden;
        }

        .template-content-header {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-secondary);
        }

        .template-content-header .btn {
            margin-right: 8px;
        }

        .template-content-view {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.6;
            font-size: 14px;
            position: relative;
            z-index: 2;
        }

        /* Стили для содержимого шаблона */
        .template-content-view ul,
        .template-content-view ol {
            padding-left: 40px;
            margin: 8px 0;
        }

        .template-content-view li {
            margin-bottom: 4px;
        }

        .template-content-view hr {
            margin: 24px 0;
            border: none;
            height: 1px;
            background-color: rgb(255 255 255 / 27%);
        }

        .light-theme .template-content-view hr {
            background-color: rgba(0, 0, 0, 0.2);
        }

        /* Пустое состояние */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 18px;
        }

        .empty-state p {
            max-width: 300px;
            line-height: 1.5;
        }

        /* Улучшенный скроллбар */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-accent);
            border-radius: 3px;
        }

        /* Заголовки групп шаблонов */
        .template-group-header {
            padding: 8px 0;
            margin: 16px 0 8px 0;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }

        .template-group-header span:first-child {
            flex: 1;
        }

        .template-group-count {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Адаптивность */
        @media (max-width: 1200px) {
            .center-column {
                width: 280px;
            }
        }

        @media (max-width: 992px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }

            .column {
                height: auto;
                width: 100% !important;
            }

            .left-column,
            .center-column {
                border-right: none;
                border-bottom: 1px solid var(--border-light);
                max-height: 40vh;
            }

            .left-column.collapsed {
                width: 100%;
            }
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: var(--text-placeholder);
        }
    </style>
</head>

<body>
    <!-- Шапка -->
    <header class="main-header">
        <div class="header-left">
            <button class="home-btn" id="homeBtn" title="Главная">
                <i class="fas fa-home"></i>
            </button>
        </div>
        
        <div class="header-center">
            <div class="app-title">
                <i class="fas fa-book"></i>
                <span>База знаний тех.поддержки</span>
            </div>
        </div>
        
        <div class="header-right">
            <button class="theme-toggle" id="themeToggleBtn" title="Переключить тему">
                <i class="fas fa-moon theme-icon moon-icon"></i>
                <i class="fas fa-sun theme-icon sun-icon"></i>
            </button>
        </div>
    </header>

    <!-- Основной контейнер -->
    <div class="main-container">
        <!-- Левый блок - Категории -->
        <div class="column left-column" id="leftColumn">
            <div class="block-header">
                <span><i class="fas fa-folder"></i> Категории</span>
                <button class="collapse-btn" id="collapseBtn">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <div class="categories-list" id="categoriesList">
                <!-- Категории будут добавляться здесь динамически -->
            </div>

            <div class="data-actions-panel" id="dataActionsPanel">
                <button class="btn btn-success btn-sm" id="refreshDataBtn">
                    <i class="fas fa-sync-alt"></i>
                    <span>Обновить данные</span>
                </button>
            </div>
        </div>

        <!-- Центральный блок - Функции и Шаблоны -->
        <div class="column center-column">
            <div class="functions-block">
                <div class="function-item">
                    <div class="function-header">
                        <div class="function-label">Копировать при клике</div>
                        <label class="switch">
                            <input type="checkbox" id="copyOnClickToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="function-description">
                        Автоматически копировать шаблон при клике
                    </div>
                </div>
            </div>

            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск по названию, тегам, описанию...">
            </div>

            <div class="templates-list" id="templatesList">
                <!-- Шаблоны будут добавляться здесь динамически -->
            </div>
        </div>

        <!-- Правый блок - Переработанный дизайн без вкладок -->
        <div class="column right-column">
            <div id="templateDetailView" class="template-detail-view">
                <div class="template-header-section">
                    <!-- Оверлей для копирования -->
                    <div class="template-header-copy-overlay" id="templateHeaderCopyOverlay">
                        <i class="fas fa-check-circle"></i>
                        <span>Скопировано в буфер обмена для ответа</span>
                    </div>

                    <div class="template-title-large" id="templateTitleLarge">Шаблон не выбран</div>

                    <div id="templateMetaGrid" class="template-meta-grid">
                        <!-- Мета-информация будет добавлена динамически -->
                    </div>

                    <div id="tagsContainer" class="tags-container">
                        <!-- Теги будут добавлены динамически -->
                    </div>

                    <!-- Кнопка "Скопировать для ответа" теперь находится внизу и на всю ширину -->
                    <div class="template-header-actions" id="templateHeaderActions">
                        <button class="btn btn-copy" id="copyAnswerBtn">
                            <i class="fas fa-copy"></i> Скопировать для ответа
                        </button>
                    </div>
                </div>

                <div class="template-content-container">
                    <div class="template-content-view" id="templateContentView">
                        <!-- Содержимое шаблона будет отображаться здесь -->
                    </div>
                </div>
            </div>

            <div id="emptyStateView" class="empty-state" style="display: none;">
                <i class="fas fa-file-alt"></i>
                <h3>Шаблон не выбран</h3>
                <p>Выберите шаблон из списка</p>
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные приложения
        let categories = [];
        let templates = [];
        let currentCategoryId = 'all';
        let currentTemplateId = null;
        let isSidebarCollapsed = false;
        let updateCheckInterval = null;
        let isLightTheme = false;

        // Инициализация приложения
        document.addEventListener('DOMContentLoaded', function() {
            loadThemePreference();
            loadInitialData();
            setupEventListeners();
            
            // Запускаем проверку обновлений каждый 10 минут
            updateCheckInterval = setInterval(checkForUpdates, 600000);
        });

        // Загрузка предпочтения темы
        function loadThemePreference() {
            const savedTheme = localStorage.getItem('support-kb-theme');
            isLightTheme = savedTheme === 'light';
            
            if (isLightTheme) {
                document.body.classList.add('light-theme');
            }
            
            // Обновляем иконку темы
            updateThemeIcon();
        }

        // Обновление иконки темы
        function updateThemeIcon() {
            // CSS переменные уже обновляются через :root и .light-theme
            // Ничего дополнительно делать не нужно
        }

        // Переключение темы
        function toggleTheme() {
            isLightTheme = !isLightTheme;
            
            if (isLightTheme) {
                document.body.classList.add('light-theme');
                localStorage.setItem('support-kb-theme', 'light');
            } else {
                document.body.classList.remove('light-theme');
                localStorage.setItem('support-kb-theme', 'dark');
            }
        }

        // Загрузка начальных данных
        function loadInitialData() {
            const savedCategories = localStorage.getItem('support-kb-categories');
            const savedTemplates = localStorage.getItem('support-kb-templates');
            
            if (savedCategories && savedTemplates) {
                // Сначала загружаем текущие данные из localStorage
                try {
                    categories = JSON.parse(savedCategories);
                    templates = JSON.parse(savedTemplates);
                    console.log('Данные загружены из localStorage');
                } catch (error) {
                    console.error('Ошибка при загрузке данных из localStorage:', error);
                    // Если данные повреждены, загружаем с сервера
                    loadDataFromServer();
                    return;
                }
                
                // Данные есть в localStorage, обновляем их
                console.log('Обновление данных с сервера...');
                updateLocalDataFromServer();
                console.log('Запущено обновление данных');
            } else {
                // Данных нет в localStorage, загружаем из data.js
                console.log('Данных нет в localStorage, загружаем из data.js');
                loadDataFromServer();
                // После загрузки данных с сервера функция сама вызовет инициализацию
                return;
            }
            
            // Загружаем состояние боковой панели
            const savedSidebarState = localStorage.getItem('support-kb-sidebar-collapsed');
            isSidebarCollapsed = savedSidebarState === 'true';
            if (isSidebarCollapsed) {
                document.getElementById('leftColumn').classList.add('collapsed');
            }
            
           // Инициализируем интерфейс
            initApp();
        }

        // Загрузка данных с сервера (из data.js) - для первоначальной загрузки
        function loadDataFromServer() {
            console.log('Загрузка данных с сервера...');
            // Добавляем временную метку, чтобы избежать кэширования
            fetch('wiki/data.js?' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(jsCode => {
                    try {
                        // Извлекаем данные из JavaScript кода
                        // Создаем временную функцию для выполнения кода и получения исходных данных
                        const tempFunction = new Function(`
                            ${jsCode};
                            // В data.js функция initAppData() должна возвращать исходные данные
                            // без учета localStorage
                            return initAppData();
                        `);
                        const data = tempFunction();
                        
                        if (data && data.categories && data.templates) {
                            // Инициализируем категории с параметрами isFavorite и favoritedAt
                            categories = data.categories.map(category => ({
                                ...category,
                                isFavorite: category.isFavorite || false,
                                favoritedAt: category.favoritedAt || null
                            }));
                            
                            templates = data.templates;
                            
                            // Сохраняем в localStorage
                            saveDataToLocalStorage();
                            
                            console.log('Данные загружены с сервера и сохранены в localStorage');
                            
                            // Загружаем состояние боковой панели
                            const savedSidebarState = localStorage.getItem('support-kb-sidebar-collapsed');
                            isSidebarCollapsed = savedSidebarState === 'true';
                            if (isSidebarCollapsed) {
                                document.getElementById('leftColumn').classList.add('collapsed');
                            }
                            
                            // Инициализируем интерфейс
                            initApp();
                        } else {
                            console.error('Неверный формат данных в data.js');
                        }
                    } catch (error) {
                        console.error('Ошибка при обработке данных:', error);
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки данных:', error);
                });
        }

        // Проверка обновлений данных - вызывается каждые 10 минут
        function checkForUpdates() {
            console.log('Проверка обновлений...');
            
            // Всегда загружаем данные с сервера для проверки
            fetch('wiki/data.js?' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(jsCode => {
                    try {
                        const tempFunction = new Function(`
                            ${jsCode};
                            return initAppData();
                        `);
                        const data = tempFunction();
                        
                        if (data && data.categories && data.templates) {
                            const serverData = {
                                categories: JSON.parse(JSON.stringify(data.categories)),
                                templates: JSON.parse(JSON.stringify(data.templates))
                            };
                            
                            // Проверяем, есть ли обновления
                            checkForDataUpdates(serverData);
                        }
                    } catch (error) {
                        console.error('Ошибка при загрузке данных для проверки:', error);
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки данных для проверки:', error);
                });
        }

        // Проверка различий между локальными данными и данными сервера
        function checkForDataUpdates(serverData) {
            if (!serverData) return;
            
            // Создаем копии текущих данных без параметров isFavorite и favoritedAt для сравнения
            const localCategoriesForCompare = categories.map(category => {
                const { isFavorite, favoritedAt, ...rest } = category;
                return rest;
            }).sort((a, b) => a.id.localeCompare(b.id));
            
            const serverCategoriesForCompare = serverData.categories.map(category => {
                const { isFavorite, favoritedAt, ...rest } = category;
                return rest;
            }).sort((a, b) => a.id.localeCompare(b.id));
            
            // Сортируем шаблоны для сравнения
            const localTemplatesSorted = [...templates].sort((a, b) => a.id.localeCompare(b.id));
            const serverTemplatesSorted = [...serverData.templates].sort((a, b) => a.id.localeCompare(b.id));
            
            // Сравниваем категории
            const categoriesChanged = !isEqual(localCategoriesForCompare, serverCategoriesForCompare);
            
            // Сравниваем шаблоны
            const templatesChanged = !isEqual(localTemplatesSorted, serverTemplatesSorted);
            
            console.log('Результат проверки обновлений:');
            console.log('Локальные категории:', localCategoriesForCompare.length, 'Серверные категории:', serverCategoriesForCompare.length);
            console.log('Локальные шаблоны:', localTemplatesSorted.length, 'Серверные шаблоны:', serverTemplatesSorted.length);
            console.log('Категории изменились:', categoriesChanged);
            console.log('Шаблоны изменились:', templatesChanged);
            
            // Если есть изменения, показываем панель обновления
            if (categoriesChanged || templatesChanged) {
                console.log('Обнаружены обновления данных');
                document.getElementById('dataActionsPanel').style.display = 'flex';
            } else {
                console.log('Данные актуальны');
                document.getElementById('dataActionsPanel').style.display = 'none';
            }
        }

        // Функция для глубокого сравнения объектов
        function isEqual(obj1, obj2) {
            return JSON.stringify(obj1) === JSON.stringify(obj2);
        }

        // Сохранение данных в localStorage
        function saveDataToLocalStorage() {
            localStorage.setItem('support-kb-categories', JSON.stringify(categories));
            localStorage.setItem('support-kb-templates', JSON.stringify(templates));
        }

        // Инициализация приложения
        function initApp() {
            renderCategories();
            renderTemplates();
            showEmptyStateView();
        }

        // Настройка обработчиков событий
        function setupEventListeners() {
            // Сворачивание боковой панели
            document.getElementById('collapseBtn').addEventListener('click', toggleSidebar);

            // Переключение темы
            document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

            // Кнопка "Домой"
            document.getElementById('homeBtn').addEventListener('click', function() {
                window.location.href = '../';
            });

            // Копирование ответа
            document.getElementById('copyAnswerBtn').addEventListener('click', copyAnswerToClipboard);

            // Обновление данных
            document.getElementById('refreshDataBtn').addEventListener('click', function() {
                updateLocalDataFromServer();
            });

            // Поиск
            document.getElementById('searchInput').addEventListener('input', filterTemplates);

            // Переключатель функций
            document.getElementById('copyOnClickToggle').addEventListener('change', updateCopyOnClick);

            // Обработка клавиш
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
                
                // Ctrl+Shift+T для переключения темы
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'T') {
                    e.preventDefault();
                    toggleTheme();
                }
                
                // Ctrl+H для кнопки "Домой"
                if ((e.ctrlKey || e.metaKey) && e.key === 'h') {
                    e.preventDefault();
                    document.getElementById('homeBtn').click();
                }
            });
        }

        // Обновление локальных данных из серверных данных
        function updateLocalDataFromServer() {
            console.log('Обновление данных с сервера...');
            
            // Загружаем данные с сервера
            fetch('wiki/data.js?' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(jsCode => {
                    try {
                        const tempFunction = new Function(`
                            ${jsCode};
                            return initAppData();
                        `);
                        const data = tempFunction();
                        
                        if (data && data.categories && data.templates) {
                            const serverData = {
                                categories: JSON.parse(JSON.stringify(data.categories)),
                                templates: JSON.parse(JSON.stringify(data.templates))
                            };
                            
                            // Обновляем категории, сохраняя isFavorite и favoritedAt из локальных данных
                            const updatedCategories = serverData.categories.map(serverCategory => {
                                const localCategory = categories.find(c => c.id === serverCategory.id);
                                
                                if (localCategory) {
                                    // Сохраняем параметры isFavorite и favoritedAt из локальных данных
                                    return {
                                        ...serverCategory,
                                        isFavorite: localCategory.isFavorite,
                                        favoritedAt: localCategory.favoritedAt
                                    };
                                } else {
                                    // Новая категория
                                    return {
                                        ...serverCategory,
                                        isFavorite: false,
                                        favoritedAt: null
                                    };
                                }
                            });
                            
                            // Обновляем шаблоны
                            const updatedTemplates = serverData.templates;
                            
                            // Сохраняем обновленные данные
                            categories = updatedCategories;
                            templates = updatedTemplates;
                            
                            // Сохраняем в localStorage
                            saveDataToLocalStorage();
                            
                            // Скрываем панель обновления
                            document.getElementById('dataActionsPanel').style.display = 'none';
                            
                            // Обновляем интерфейс
                            renderCategories();
                            renderTemplates();
                            
                            // Если выбран шаблон, который мог быть удален, сбрасываем выбор
                            if (currentTemplateId && !templates.find(t => t.id === currentTemplateId)) {
                                currentTemplateId = null;
                                showEmptyStateView();
                            }
                            
                            console.log('Данные обновлены с сервера');
                        }
                    } catch (error) {
                        console.error('Ошибка при обновлении данных:', error);
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки данных для обновления:', error);
                });
        }

        // Рендеринг категорий
        function renderCategories() {
            const categoriesList = document.getElementById('categoriesList');

            // Очищаем список
            categoriesList.innerHTML = '';

            // 1. Все шаблоны
            const allTemplatesItem = document.createElement('div');
            allTemplatesItem.className = `category-item ${currentCategoryId === 'all' ? 'active' : ''}`;
            const allTemplatesCount = templates.length;
            allTemplatesItem.innerHTML = `
                <div class="category-icon-wrapper" style="background: linear-gradient(135deg, #64748b, #475569);">
                    <i class="category-icon fas fa-th-list"></i>
                </div>
                <div class="category-content">
                    <div>
                        <div class="category-name">Все шаблоны</div>
                        <div class="category-count">${allTemplatesCount} ${pluralizeTemplates(allTemplatesCount)}</div>
                    </div>
                </div>
            `;
            allTemplatesItem.addEventListener('click', function() {
                currentCategoryId = 'all';
                renderCategories();
                renderTemplates();
            });

            categoriesList.appendChild(allTemplatesItem);

            // Разделитель
            const divider = document.createElement('div');
            divider.className = 'category-divider';
            categoriesList.appendChild(divider);

            // 2. Избранные категории (сортировка по дате добавления в избранное)
            const favoriteCategories = categories
                .filter(category => category.isFavorite)
                .sort((a, b) => new Date(b.favoritedAt) - new Date(a.favoritedAt));

            if (favoriteCategories.length > 0) {
                // Заголовок для избранных
                const favoriteHeader = document.createElement('div');
                favoriteHeader.className = 'category-divider';
                favoriteHeader.style.position = 'relative';
                favoriteHeader.innerHTML = `
                    <div style="position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: var(--bg-secondary); padding: 0 10px; font-size: 11px; color: var(--text-muted);">
                        <i class="fas fa-star" style="color: #fbbf24; margin-right: 4px;"></i>Избранное
                    </div>
                `;
                categoriesList.appendChild(favoriteHeader);

                // Избранные категории
                favoriteCategories.forEach(category => {
                    renderCategoryItem(category, categoriesList);
                });

                // Разделитель между избранными и обычными
                const favoritesDivider = document.createElement('div');
                favoritesDivider.className = 'category-divider';
                categoriesList.appendChild(favoritesDivider);
            }

            // 3. Остальные категории
            const regularCategories = categories.filter(category => !category.isFavorite);
            regularCategories.forEach(category => {
                renderCategoryItem(category, categoriesList);
            });
        }

        // Рендер одной категории
        function renderCategoryItem(category, container) {
            const categoryItem = document.createElement('div');
            categoryItem.className = `category-item ${currentCategoryId === category.id ? 'active' : ''}`;
            categoryItem.dataset.categoryId = category.id;

            const isFavorite = category.isFavorite;
            const favoriteIcon = isFavorite ? 'fas fa-star' : 'far fa-star';
            const favoriteTitle = isFavorite ? 'Убрать из избранного' : 'Добавить в избранное';

            const categoryTemplatesCount = templates.filter(t => t.categoryId === category.id).length;

            const categoryHtml = `
                <div class="category-icon-wrapper" style="background: ${category.color};">
                    <i class="category-icon ${category.icon || 'fas fa-folder'}"></i>
                </div>
                <div class="category-content">
                    <div>
                        <div class="category-name">${category.name}</div>
                        <div class="category-count">${categoryTemplatesCount} ${pluralizeTemplates(categoryTemplatesCount)}</div>
                    </div>
                </div>
                <div class="favorite-star ${isFavorite ? 'active' : ''}" title="${favoriteTitle}" data-action="toggleFavorite">
                    <i class="${favoriteIcon}"></i>
                </div>
            `;

            categoryItem.innerHTML = categoryHtml;

            // Обработчик клика по категории
            categoryItem.addEventListener('click', function(e) {
                // Если клик был по звездочке, обработаем отдельно
                if (e.target.closest('.favorite-star')) {
                    toggleCategoryFavorite(category.id);
                    return;
                }

                currentCategoryId = category.id;
                renderCategories();
                renderTemplates();
            });

            container.appendChild(categoryItem);
        }

        // Переключение избранного для категории
        function toggleCategoryFavorite(categoryId) {
            const categoryIndex = categories.findIndex(c => c.id === categoryId);
            if (categoryIndex === -1) return;

            categories[categoryIndex].isFavorite = !categories[categoryIndex].isFavorite;

            if (categories[categoryIndex].isFavorite) {
                categories[categoryIndex].favoritedAt = new Date().toISOString();
            } else {
                categories[categoryIndex].favoritedAt = null;
            }

            saveDataToLocalStorage();
            renderCategories();
        }

        // Рендеринг шаблонов с сортировкой по типам
        function renderTemplates() {
            const templatesList = document.getElementById('templatesList');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            // Фильтрация шаблонов
            let filteredTemplates = templates;

            if (currentCategoryId !== 'all') {
                filteredTemplates = filteredTemplates.filter(t => t.categoryId === currentCategoryId);
            }

            if (searchQuery) {
                filteredTemplates = filteredTemplates.filter(t =>
                    t.title.toLowerCase().includes(searchQuery) ||
                    t.description.toLowerCase().includes(searchQuery) ||
                    (t.tags && t.tags.some(tag => tag.toLowerCase().includes(searchQuery)))
                );
            }

            // Очищаем список
            templatesList.innerHTML = '';

            if (filteredTemplates.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <i class="fas fa-search"></i>
                    <h3>Шаблоны не найдены</h3>
                    <p>Попробуйте изменить критерии поиска</p>
                `;
                templatesList.appendChild(emptyState);
                return;
            }

            // Определяем порядок сортировки по типам
            const typeOrder = {
                'recommendation': 1,
                'information': 2,
                'check': 3,
                'other': 4
            };

            // Сортируем шаблоны по типу
            filteredTemplates.sort((a, b) => typeOrder[a.type] - typeOrder[b.type]);

            // Группируем шаблоны по типу
            const groupedTemplates = {};
            filteredTemplates.forEach(template => {
                if (!groupedTemplates[template.type]) {
                    groupedTemplates[template.type] = [];
                }
                groupedTemplates[template.type].push(template);
            });

            // Рендерим группы в заданном порядке
            const typesOrder = ['recommendation', 'information', 'check', 'other'];

            typesOrder.forEach(type => {
                if (groupedTemplates[type] && groupedTemplates[type].length > 0) {
                    // Добавляем заголовок группы
                    let groupTitle = '';
                    switch (type) {
                        case 'recommendation':
                            groupTitle = 'Рекомендации';
                            break;
                        case 'information':
                            groupTitle = 'Информация';
                            break;
                        case 'check':
                            groupTitle = 'Проверки';
                            break;
                        default:
                            groupTitle = 'Остальное';
                    }

                    const groupHeader = document.createElement('div');
                    groupHeader.className = 'template-group-header';
                    groupHeader.innerHTML = `
                        <span>${groupTitle}</span>
                        <span class="template-group-count">${groupedTemplates[type].length}</span>
                    `;
                    templatesList.appendChild(groupHeader);

                    // Рендерим шаблоны в группе
                    groupedTemplates[type].forEach(template => {
                        const category = categories.find(c => c.id === template.categoryId);
                        const templateItem = document.createElement('div');
                        templateItem.className = `template-item ${currentTemplateId === template.id ? 'active' : ''}`;
                        templateItem.dataset.templateId = template.id;

                        // Определяем, нужно ли показывать категорию
                        const showCategory = currentCategoryId === 'all' && category;
                        const showMarginBottom = currentCategoryId === 'all';

                        // Определяем тип шаблона
                        let typeText = '';
                        let typeClass = '';
                        switch (template.type) {
                            case 'recommendation':
                                typeText = 'Рекомендация';
                                typeClass = 'type-recommendation';
                                break;
                            case 'information':
                                typeText = 'Информация';
                                typeClass = 'type-information';
                                break;
                            case 'check':
                                typeText = 'Проверка';
                                typeClass = 'type-check';
                                break;
                            default:
                                typeText = 'Остальное';
                                typeClass = 'type-other';
                        }

                        templateItem.innerHTML = `
                            <div class="template-header ${showMarginBottom ? '' : 'no-margin'}">
                                <div class="kb-match-indicator kb-match-${template.kbMatch}"></div>
                                <div class="template-title">${template.title}</div>
                                <span class="template-type-badge ${typeClass}">${typeText}</span>
                            </div>
                            ${showCategory ? `<div class="template-category-badge">${category.name}</div>` : ''}
                        `;

                        templateItem.addEventListener('click', function(e) {
                            // Всегда открываем шаблон для просмотра
                            selectTemplate(template.id);

                            // Если включено копирование по клику, то копируем
                            const copyOnClick = document.getElementById('copyOnClickToggle').checked;
                            if (copyOnClick) {
                                copyOnClickWithEffect(template.id);
                            }
                        });

                        templatesList.appendChild(templateItem);
                    });
                }
            });
        }

        // Показать детальную информацию о шаблоне
        function showTemplateDetail(templateId) {
            const template = templates.find(t => t.id === templateId);
            if (!template) return;

            const category = categories.find(c => c.id === template.categoryId);

            document.getElementById('templateDetailView').style.display = 'flex';
            document.getElementById('emptyStateView').style.display = 'none';

            // Заголовок
            document.getElementById('templateTitleLarge').textContent = template.title;

            // Определяем тип шаблона
            let typeText = '';
            switch (template.type) {
                case 'recommendation':
                    typeText = 'Рекомендация';
                    break;
                case 'information':
                    typeText = 'Информация';
                    break;
                case 'check':
                    typeText = 'Проверка';
                    break;
                default:
                    typeText = 'Остальное';
            }

            let kbMatchText = '';
            if (template.kbMatch === 'true') kbMatchText = 'Соответствует';
            else if (template.kbMatch === 'partial') kbMatchText = 'Частично';
            else kbMatchText = 'Не соответствует';

            const metaHtml = `
                <div class="meta-item">
                    <div class="meta-label">Категория</div>
                    <div class="meta-value">
                        <i class="fas fa-folder" style="color: ${category?.color || '#64748b'};"></i>
                        <span>${category?.name || 'Без категории'}</span>
                    </div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Тип шаблона</div>
                    <div class="meta-value">
                        <i class="fas fa-tag"></i>
                        <span>${typeText}</span>
                    </div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Соответствие БЗ</div>
                    <div class="meta-value">
                        <div class="kb-match-indicator kb-match-${template.kbMatch}"></div>
                        <span>${kbMatchText}</span>
                    </div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Дата создания</div>
                    <div class="meta-value">
                        <i class="far fa-calendar"></i>
                        <span>${formatDate(template.createdAt)}</span>
                    </div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Дата обновления</div>
                    <div class="meta-value">
                        <i class="fas fa-history"></i>
                        <span>${formatDate(template.updatedAt)}</span>
                    </div>
                </div>
                <div class="meta-item" style="grid-column: 1 / -1;">
                    <div class="meta-label">Описание</div>
                    <div class="meta-value">${template.description || 'Описание отсутствует'}</div>
                </div>
            `;
            document.getElementById('templateMetaGrid').innerHTML = metaHtml;

            // Теги
            const tagsHtml = template.tags && template.tags.length > 0 ?
                template.tags.map(tag => `<span class="tag">${tag}</span>`).join('') :
                '<span class="tag" style="opacity: 0.5;">Теги не указаны</span>';
            document.getElementById('tagsContainer').innerHTML = tagsHtml;

            // Содержимое шаблона - очищаем атрибуты у <hr>
            let content = template.content;

            // Очищаем атрибуты у тега <hr>
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;

            // Находим все <hr> элементы и удаляем у них все атрибуты
            const hrElements = tempDiv.querySelectorAll('hr');
            hrElements.forEach(hr => {
                // Сохраняем родительский элемент
                const parent = hr.parentNode;

                // Создаем новый чистый <hr> без атрибутов
                const newHr = document.createElement('hr');

                // Заменяем старый <hr> на новый
                parent.replaceChild(newHr, hr);
            });

            content = tempDiv.innerHTML;
            document.getElementById('templateContentView').innerHTML = content;
        }

        // Показать пустое состояние
        function showEmptyStateView() {
            document.getElementById('templateDetailView').style.display = 'none';
            document.getElementById('emptyStateView').style.display = 'flex';
        }

        // Выбор шаблона
        function selectTemplate(templateId) {
            currentTemplateId = templateId;
            renderTemplates();
            showTemplateDetail(templateId);
        }

        // Сворачивание/разворачивание боковой панели
        function toggleSidebar() {
            const leftColumn = document.getElementById('leftColumn');
            isSidebarCollapsed = !isSidebarCollapsed;

            if (isSidebarCollapsed) {
                leftColumn.classList.add('collapsed');
            } else {
                leftColumn.classList.remove('collapsed');
            }

            localStorage.setItem('support-kb-sidebar-collapsed', isSidebarCollapsed);
        }

        // Показать оверлей копирования
        function showCopyOverlay() {
            const overlay = document.getElementById('templateHeaderCopyOverlay');

            // Сбрасываем предыдущую анимацию
            overlay.classList.remove('show');

            // Принудительный reflow для сброса анимации
            void overlay.offsetWidth;

            // Запускаем анимацию
            overlay.classList.add('show');

            // Через 2 секунды скрываем оверлей (анимация завершится сама)
            setTimeout(() => {
                overlay.classList.remove('show');
            }, 2000);
        }

        // Копирование по клику с показом оверлея
        function copyOnClickWithEffect(templateId) {
            const template = templates.find(t => t.id === templateId);
            if (!template) return;

            copyTemplateContentToClipboard(template);
            showCopyOverlay();
        }

        // Копирование ответа в буфер обмена (для кнопки)
        function copyAnswerToClipboard() {
            if (!currentTemplateId) return;

            const template = templates.find(t => t.id === currentTemplateId);
            if (!template) return;

            copyTemplateContentToClipboard(template);
            showCopyOverlay();
        }

        // Функция копирования содержимого шаблона
        function copyTemplateContentToClipboard(template) {
            // Создаем временный элемент для копирования HTML
            const tempElement = document.createElement('div');
            tempElement.innerHTML = template.content;

            // Создаем элемент для копирования текста
            const textElement = document.createElement('textarea');
            textElement.value = tempElement.textContent || tempElement.innerText || '';
            document.body.appendChild(textElement);
            textElement.select();

            try {
                // Пытаемся скопировать HTML
                const htmlBlob = new Blob([template.content], {
                    type: 'text/html'
                });
                const textBlob = new Blob([textElement.value], {
                    type: 'text/plain'
                });

                const clipboardItem = new ClipboardItem({
                    'text/html': htmlBlob,
                    'text/plain': textBlob
                });

                navigator.clipboard.write([clipboardItem]).then(() => {
                    showCopyOverlay();
                }).catch(err => {
                    // Если не поддерживается Clipboard API с HTML, копируем текст
                    navigator.clipboard.writeText(textElement.value).then(() => {
                        showCopyOverlay();
                    }).catch(err => {
                        console.error('Ошибка копирования: ', err);
                    });
                });
            } catch (err) {
                // Fallback для старых браузеров
                document.execCommand('copy');
                showCopyOverlay();
            } finally {
                document.body.removeChild(textElement);
            }
        }

        // Обновление функции копирования при клике
        function updateCopyOnClick() {
            const copyOnClick = document.getElementById('copyOnClickToggle').checked;
            const templatesList = document.getElementById('templatesList');

            if (copyOnClick) {
                // Меняем курсор на copy для всех шаблонов
                const templateItems = templatesList.querySelectorAll('.template-item');
                templateItems.forEach(item => {
                    item.style.cursor = 'copy';
                });
            } else {
                // Возвращаем обычный курсор
                const templateItems = templatesList.querySelectorAll('.template-item');
                templateItems.forEach(item => {
                    item.style.cursor = 'pointer';
                });
            }
        }

        // Фильтрация шаблонов
        function filterTemplates() {
            renderTemplates();
        }

        // Форматирование даты
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }

        // Вспомогательная функция для склонения слова "шаблон"
        function pluralizeTemplates(count) {
            if (count % 10 === 1 && count % 100 !== 11) {
                return 'шаблон';
            } else if ([2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100)) {
                return 'шаблона';
            } else {
                return 'шаблонов';
            }
        }
    </script>
</body>
